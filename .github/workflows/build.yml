name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create mod files
        run: |
          mkdir -p src/main/java/com/kazunovoice src/main/resources/META-INF src/main/resources/assets/kazunovoice/lang src/main/resources/assets/kazunovoice/models/item src/main/resources/assets/kazunovoice/textures/item
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
              }
          }
          rootProject.name = 'KazUnoVoice'
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          minecraft_version=1.20.1
          forge_version=47.4.5
          mod_id=kazunovoice
          mod_version=1.1.0
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'eclipse'
              id 'idea'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = mod_version
          group = 'com.kazunovoice'
          base { archivesName = 'KazUnoVoice' }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: minecraft_version
          }

          repositories { }

          dependencies {
              minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
          }

          tasks.named('jar', Jar).configure {
              manifest.attributes([
                  'Specification-Title': mod_id,
                  'Specification-Version': '1',
                  'Implementation-Title': 'KazUnoVoice',
                  'Implementation-Version': mod_version
              ])
              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF_FILE
          cat > src/main/resources/META-INF/mods.toml <<'EOF_FILE'
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="kazunovoice"
          version="1.1.0"
          displayName="KazUnoVoice"
          description='''KazUnoVoice - мод с отдельной вкладкой в креативе.'''

          [[dependencies.kazunovoice]]
          modId="forge"
          mandatory=true
          versionRange="[47,)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.kazunovoice]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.20.1,1.21)"
          ordering="NONE"
          side="BOTH"
          EOF_FILE
          cat > src/main/resources/pack.mcmeta <<'EOF_FILE'
          { "pack": { "description": "KazUnoVoice resources", "pack_format": 15 } }
          EOF_FILE
          cat > src/main/java/com/kazunovoice/KazUnoVoice.java <<'EOF_FILE'
          package com.kazunovoice;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          @Mod(KazUnoVoice.MODID)
          public class KazUnoVoice {
              public static final String MODID = "kazunovoice";
              public KazUnoVoice() {
                  IEventBus bus = FMLJavaModLoadingContext.get().getModEventBus();
                  ModItems.ITEMS.register(bus);
                  ModCreativeTabs.TABS.register(bus);
              }
          }
          EOF_FILE
          cat > src/main/java/com/kazunovoice/ModItems.java <<'EOF_FILE'
          package com.kazunovoice;
          import net.minecraft.world.item.Item;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;
          public class ModItems {
              public static final DeferredRegister<Item> ITEMS =
                      DeferredRegister.create(ForgeRegistries.ITEMS, KazUnoVoice.MODID);
              public static final RegistryObject<Item> VOICE_CRYSTAL =
                      ITEMS.register("voice_crystal", () -> new Item(new Item.Properties()));
              public static final RegistryObject<Item> UNO_CARD =
                      ITEMS.register("uno_card", () -> new Item(new Item.Properties()));
              public static final RegistryObject<Item> KAZ_COIN =
                      ITEMS.register("kaz_coin", () -> new Item(new Item.Properties()));
          }
          EOF_FILE
          cat > src/main/java/com/kazunovoice/ModCreativeTabs.java <<'EOF_FILE'
          package com.kazunovoice;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.item.CreativeModeTab;
          import net.minecraft.world.item.ItemStack;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.RegistryObject;
          public class ModCreativeTabs {
              public static final DeferredRegister<CreativeModeTab> TABS =
                      DeferredRegister.create(Registries.CREATIVE_MODE_TAB, KazUnoVoice.MODID);
              public static final RegistryObject<CreativeModeTab> KAZ_TAB = TABS.register("kazunovoice_tab",
                      () -> CreativeModeTab.builder()
                              .title(Component.translatable("itemGroup.kazunovoice"))
                              .icon(() -> new ItemStack(ModItems.VOICE_CRYSTAL.get()))
                              .displayItems((params, output) -> {
                                  output.accept(ModItems.VOICE_CRYSTAL.get());
                                  output.accept(ModItems.UNO_CARD.get());
                                  output.accept(ModItems.KAZ_COIN.get());
                              })
                              .build());
          }
          EOF_FILE
          cat > src/main/java/com/kazunovoice/WelcomeHandler.java <<'EOF_FILE'
          package com.kazunovoice;
          import java.awt.Color;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import java.util.UUID;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.network.chat.Component;
          import net.minecraft.network.chat.MutableComponent;
          import net.minecraft.network.chat.Style;
          import net.minecraft.network.chat.TextColor;
          import net.minecraft.network.protocol.game.ClientboundSetActionBarTextPacket;
          import net.minecraft.network.protocol.game.ClientboundSetSubtitleTextPacket;
          import net.minecraft.network.protocol.game.ClientboundSetTitleTextPacket;
          import net.minecraft.network.protocol.game.ClientboundSetTitlesAnimationPacket;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvent;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.entity.player.PlayerEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.registries.ForgeRegistries;
          @Mod.EventBusSubscriber(modid = KazUnoVoice.MODID)
          public class WelcomeHandler {
              private static final int DURATION = 100;
              private static final int[] MELODY = {0, 4, 7, 12, 16, 19, 24};
              private static final List<Anim> ACTIVE = new ArrayList<>();
              private static class Anim {
                  final UUID id;
                  final MinecraftServer server;
                  int t = 0;
                  Anim(UUID id, MinecraftServer server) { this.id = id; this.server = server; }
              }
              @SubscribeEvent
              public static void onJoin(PlayerEvent.PlayerLoggedInEvent e) {
                  if (!(e.getEntity() instanceof ServerPlayer p)) return;
                  MinecraftServer server = p.getServer();
                  if (server == null) return;
                  p.connection.send(new ClientboundSetTitlesAnimationPacket(0, DURATION, 20));
                  ACTIVE.add(new Anim(p.getUUID(), server));
                  String name = p.getName().getString();
                  MutableComponent chat = Component.literal("✦ ").withStyle(Style.EMPTY.withColor(TextColor.fromRgb(0xFFD700)))
                          .append(rainbow(name, 0))
                          .append(Component.literal(" зашёл на сервер! Добро пожаловать! ✦")
                                  .withStyle(Style.EMPTY.withColor(TextColor.fromRgb(0xFFD700))));
                  server.getPlayerList().broadcastSystemMessage(chat, false);
                  for (ServerPlayer other : server.getPlayerList().getPlayers()) {
                      if (other == p) continue;
                      other.connection.send(new ClientboundSetActionBarTextPacket(
                              Component.literal("✦ ").append(rainbow(name, 10)).append(Component.literal(" присоединился! ✦"))));
                      other.playNotifySound(SoundEvents.PLAYER_LEVELUP, SoundSource.PLAYERS, 0.6f, 1.2f);
                  }
              }
              @SubscribeEvent
              public static void onTick(TickEvent.ServerTickEvent e) {
                  if (e.phase != TickEvent.Phase.END || ACTIVE.isEmpty()) return;
                  Iterator<Anim> it = ACTIVE.iterator();
                  while (it.hasNext()) {
                      Anim a = it.next();
                      ServerPlayer p = a.server.getPlayerList().getPlayer(a.id);
                      if (p == null || a.t >= DURATION) {
                          it.remove();
                          continue;
                      }
                      step(a, p);
                      a.t++;
                  }
              }
              private static void step(Anim a, ServerPlayer p) {
                  int t = a.t;
                  ServerLevel lvl = p.serverLevel();
                  double x = p.getX(), y = p.getY(), z = p.getZ();
                  if (t % 3 == 0) {
                      p.connection.send(new ClientboundSetTitleTextPacket(rainbow("✦ Добро пожаловать ✦", t)));
                      p.connection.send(new ClientboundSetSubtitleTextPacket(rainbow(p.getName().getString(), t * 2)));
                  }
                  if (t == 0) {
                      lvl.playSound(null, x, y, z, SoundEvents.FIREWORK_ROCKET_LAUNCH, SoundSource.PLAYERS, 1f, 1f);
                      p.playNotifySound(SoundEvents.UI_TOAST_CHALLENGE_COMPLETE, SoundSource.PLAYERS, 1f, 1f);
                  }
                  if (t % 4 == 0 && t / 4 < MELODY.length) {
                      float pitch = (float) Math.pow(2.0, (MELODY[t / 4] - 12) / 12.0);
                      SoundEvent chime = ForgeRegistries.SOUND_EVENTS.getValue(new ResourceLocation("block.note_block.chime"));
                      SoundEvent bell = ForgeRegistries.SOUND_EVENTS.getValue(new ResourceLocation("block.note_block.bell"));
                      if (chime != null) lvl.playSound(null, x, y, z, chime, SoundSource.PLAYERS, 1f, pitch);
                      if (bell != null) lvl.playSound(null, x, y, z, bell, SoundSource.PLAYERS, 0.8f, pitch);
                  }
                  double ang = t * 0.45;
                  double h = (t % 50) * 0.05;
                  for (int k = 0; k < 3; k++) {
                      double aa = ang + k * (Math.PI * 2 / 3);
                      double r = 1.3;
                      lvl.sendParticles(ParticleTypes.END_ROD,
                              x + Math.cos(aa) * r, y + h, z + Math.sin(aa) * r, 1, 0, 0, 0, 0);
                      lvl.sendParticles(ParticleTypes.FIREWORK,
                              x + Math.cos(-aa) * r * 0.7, y + 2.5 - h, z + Math.sin(-aa) * r * 0.7, 1, 0, 0, 0, 0.01);
                  }
                  if (t % 20 == 0) {
                      for (int i = 0; i < 36; i++) {
                          double aa = i * Math.PI * 2 / 36;
                          lvl.sendParticles(ParticleTypes.FIREWORK,
                                  x + Math.cos(aa) * 0.3, y + 0.1, z + Math.sin(aa) * 0.3,
                                  0, Math.cos(aa), 0.05, Math.sin(aa), 0.25);
                      }
                  }
                  if (t == DURATION - 20) {
                      lvl.playSound(null, x, y, z, SoundEvents.FIREWORK_ROCKET_BLAST, SoundSource.PLAYERS, 1f, 1f);
                      lvl.playSound(null, x, y, z, SoundEvents.PLAYER_LEVELUP, SoundSource.PLAYERS, 1f, 1f);
                      lvl.sendParticles(ParticleTypes.TOTEM_OF_UNDYING, x, y + 1.2, z, 120, 0.6, 0.9, 0.6, 0.45);
                      lvl.sendParticles(ParticleTypes.FIREWORK, x, y + 2.0, z, 80, 0.4, 0.4, 0.4, 0.35);
                  }
              }
              private static MutableComponent rainbow(String s, int shift) {
                  MutableComponent c = Component.empty();
                  for (int i = 0; i < s.length(); i++) {
                      float hue = (i * 0.06f + shift * 0.03f) % 1f;
                      int rgb = Color.HSBtoRGB(hue, 0.7f, 1f) & 0xFFFFFF;
                      c.append(Component.literal(String.valueOf(s.charAt(i)))
                              .withStyle(Style.EMPTY.withColor(TextColor.fromRgb(rgb)).withBold(true)));
                  }
                  return c;
              }
          }
          EOF_FILE
          cat > src/main/resources/assets/kazunovoice/lang/en_us.json <<'EOF_FILE'
          {
            "itemGroup.kazunovoice": "KazUnoVoice",
            "item.kazunovoice.voice_crystal": "Voice Crystal",
            "item.kazunovoice.uno_card": "Uno Card",
            "item.kazunovoice.kaz_coin": "Kaz Coin"
          }
          EOF_FILE
          cat > src/main/resources/assets/kazunovoice/lang/ru_ru.json <<'EOF_FILE'
          {
            "itemGroup.kazunovoice": "KazUnoVoice",
            "item.kazunovoice.voice_crystal": "Кристалл голоса",
            "item.kazunovoice.uno_card": "Карта Уно",
            "item.kazunovoice.kaz_coin": "Каз-монета"
          }
          EOF_FILE
          cat > src/main/resources/assets/kazunovoice/models/item/voice_crystal.json <<'EOF_FILE'
          { "parent": "item/generated", "textures": { "layer0": "kazunovoice:item/voice_crystal" } }
          EOF_FILE
          cat > src/main/resources/assets/kazunovoice/models/item/uno_card.json <<'EOF_FILE'
          { "parent": "item/generated", "textures": { "layer0": "kazunovoice:item/uno_card" } }
          EOF_FILE
          cat > src/main/resources/assets/kazunovoice/models/item/kaz_coin.json <<'EOF_FILE'
          { "parent": "item/generated", "textures": { "layer0": "kazunovoice:item/kaz_coin" } }
          EOF_FILE
          echo 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAASklEQVR4nGNgoCUQiVrwH4Qp0kyWITBNASf+gzFJhqBrJskQXJqJMoSQZryGEKsZpyEUG0CxF6gSiFSJRlyGUJQaqZIfyNJMLAAASnIj3Oa4R5QAAAAASUVORK5CYII=' | base64 -d > src/main/resources/assets/kazunovoice/textures/item/voice_crystal.png
          echo 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAIklEQVR4nGNgoCb4TyTAa8AzIyO8eNSAUQNGigEUZSZyAADab4rAXdvN8gAAAABJRU5ErkJggg==' | base64 -d > src/main/resources/assets/kazunovoice/textures/item/uno_card.png
          echo 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAARklEQVR4nGNgoAVYkMfwHxsmSfP/SxoomChDsGnEZhDZmnEagsvZ+AxAMYQUzVhdMUwMoCgQKY5GqiQkQt4hKz+QlZlIBQD6XKbMvqkezAAAAABJRU5ErkJggg==' | base64 -d > src/main/resources/assets/kazunovoice/textures/item/kaz_coin.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KazUnoVoice-jar
          path: build/libs/*.jar
